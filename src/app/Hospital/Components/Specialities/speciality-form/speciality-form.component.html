<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="d-flex flex-column gap-4 p-3"
>
  <div class="row flex-wrap gy-2">
    <div class="col-lg-3">
      <app-input
        formControlName="code"
        label="code"
        type="text"
        placeholder=""
        icon="bi bi-upc-scan"
        [errorMessages]="{
          required: 'code is required',
          backendError: apiFieldErrors['code'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="nameEn"
        label="English Name"
        type="text"
        placeholder=""
        icon="bi bi-card-text"
        [errorMessages]="{
          required: 'name is required',
          backendError: apiFieldErrors['nameEn'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="nameAr"
        label="Arabic Name"
        type="text"
        placeholder=""
        icon="bi bi-card-text"
        [errorMessages]="{
          required: 'name is required',
          backendError: apiFieldErrors['nameAr'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="defaultPrice"
        label="Default Price"
        type="text"
        placeholder=""
        icon="bi bi-cash-coin"
        [errorMessages]="{
          required: 'Price is required',
          backendError: apiFieldErrors['defaultPrice'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="defaultVisitDuration"
        label="Default Visit Duration"
        type="text"
        placeholder=""
        icon="bi bi-stopwatch"
        [errorMessages]="{
          required: 'Visit Duration is required',
          backendError: apiFieldErrors['defaultVisitDuration'],
        }"
      />
    </div>
    <div class="py-2 px-3">
        <app-toggle-btn
          formControlName="isActive"
          label="Set Speciality as Active"
        />
    </div>
  </div>
  <div class="d-flex justify-content-end gap-2">
    <app-button btnLabel="Cancel" [mainBtn]="false" (click)="cancel()" />
    <app-button btnLabel="Save Speciality" buttonType="submit" />
  </div>
</form>
