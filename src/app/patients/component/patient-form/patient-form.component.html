<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="d-flex flex-column gap-4 p-3"
>
  <div class="row flex-wrap gy-2">
    <div class="col-lg-3">
      <spk-ng-select
        formControlName="identityTypeLookupId"
        label="Identity Type"
        [options]="$any((identityTypes$ | async)?.lookupDetails ?? [])"
        bindLabel="valueNameEn"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose Identity Type"
        selectClass="form-control"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="identityNumber"
        label="Identity value"
        type="text"
        placeholder=""
        icon="fa-solid fa-user"
        [errorMessages]="{
          required: 'Username is required',
          backendError: apiFieldErrors['username'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="email"
        label="Email Address"
        type="email"
        placeholder="email@gmail.com"
        icon="fa-solid fa-envelope"
        [errorMessages]="{
          required: 'email is required',
          email: 'this is an invalid email',
          backendError: apiFieldErrors['email'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="mobile"
        label="Mobile Number"
        type="text"
        placeholder="012xxxxxxxx"
        icon="fa-solid fa-phone"
        [errorMessages]="{
          required: 'phone is required',
          backendError: apiFieldErrors['phone'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="phone"
        label="Phone Number"
        type="text"
        placeholder="012xxxxxxxx"
        icon="fa-solid fa-phone"
        [errorMessages]="{
          required: 'phone is required',
          backendError: apiFieldErrors['phone'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="firstNameEn"
        label="First Name"
        type="text"
        placeholder="John"
        icon="fa-solid fa-user"
        [errorMessages]="{
          required: 'First Name is required',
          minlength: 'First Name is too short',
          maxlength: `First Name can't exceed 20 charahcter`,
          backendError: apiFieldErrors['firstName'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="middleNameEn"
        label="Middle Name"
        type="text"
        placeholder="John"
        icon="fa-solid fa-user"
        [errorMessages]="{
          required: 'Middle Name is required',
          minlength: 'Middle Name is too short',
          maxlength: `Middle Name can't exceed 20 charahcter`,
          backendError: apiFieldErrors['middleName'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="lastNameEn"
        label="Last Name"
        type="text"
        placeholder="John"
        icon="fa-solid fa-user"
        [errorMessages]="{
          required: 'Last Name is required',
          minlength: 'Last Name is too short',
          maxlength: `Last Name can't exceed 20 charahcter`,
          backendError: apiFieldErrors['lastName'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="firstNameAr"
        label="First Name"
        type="text"
        placeholder="John"
        icon="fa-solid fa-user"
        [errorMessages]="{
          required: 'First Name is required',
          minlength: 'First Name is too short',
          maxlength: `First Name can't exceed 20 charahcter`,
          backendError: apiFieldErrors['firstName'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="middleNameAr"
        label="Middle Name"
        type="text"
        placeholder="John"
        icon="fa-solid fa-user"
        [errorMessages]="{
          required: 'Middle Name is required',
          minlength: 'Middle Name is too short',
          maxlength: `Middle Name can't exceed 20 charahcter`,
          backendError: apiFieldErrors['middleName'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="lastNameAr"
        label="Last Name"
        type="text"
        placeholder="John"
        icon="fa-solid fa-user"
        [errorMessages]="{
          required: 'Last Name is required',
          minlength: 'Last Name is too short',
          maxlength: `Last Name can't exceed 20 charahcter`,
          backendError: apiFieldErrors['lastName'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <spk-flatpickr
        formControlName="birthDate"
        [enableTime]="true"
        [dateFormat]="'Y-m-d H:i'"
        placeholder="Choose Date"
        label="Birth day"
      ></spk-flatpickr>
    </div>
    <div class="col-lg-3">
      <spk-ng-select
        formControlName="genderLookupId"
        label="Gender"
        [options]="$any((gender$ | async)?.lookupDetails ?? [])"
        bindLabel="valueNameEn"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose gender"
        selectClass="form-control"
      />
    </div>

    <div class="col-lg-3">
      <spk-ng-select
        formControlName="maritalStatusLookupId"
        label="Marital Status"
        [options]="$any((maritalStatues$ | async)?.lookupDetails ?? [])"
        bindLabel="valueNameEn"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose Status"
        selectClass="form-control"
      />
    </div>
    <div class="col-lg-3">
      <spk-ng-select
        formControlName="nationalityLookupId"
        label="Nationality"
        [options]="$any((natiinalities$ | async)?.lookupDetails ?? [])"
        bindLabel="valueNameEn"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose Status"
        selectClass="form-control"
      />
    </div>
      <div class="col-lg-3">
      <spk-ng-select
        formControlName="bloodGroupLookupId"
        label="Blood Group"
        [options]="$any((bloodGroups$ | async)?.lookupDetails ?? [])"
        bindLabel="valueNameEn"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose Status"
        selectClass="form-control"
      />
    </div>
    <div class="col-lg-3">
      <spk-ng-select
        formControlName="branchId"
        label="Branch"
        [options]="$any((branches$ | async) ?? [])"
        bindLabel="name"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose Branch"
        selectClass="form-control"
      />
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2">
    <app-button btnLabel="Cancel" [mainBtn]="false" (click)="cancel()" />
    <app-button btnLabel="Save Patient" buttonType="submit" />
  </div>
</form>
