<div class="p-3">
  <div [hidden]="hidden()">
    <app-reusable-material-table
      [columns]="columns"
      [data]="patients()"
      [totalCount]="total()"
      [pageSize]="pageSize()"
            title="patient"

      (pageChange)="onPageChange($event)"
      (filterChange)="onFilterChange($event)"
      (sortChange)="onSortChange($event)"
      (editRow)="handleEdit($event)"
      (deleteRow)="handleDelete($event)"
      (onFirstCellClickChange)="handleSingleUserNavigation($event)"
      (onAddNewChange)="handleAddNew()"
    >
    </app-reusable-material-table>
  </div>
  <div>
    <app-patient-form [hidden]="!hidden()" (cancalEvent)="onCancal()" [oid]="oid"  (setToastObject)="setToastObject($event)"/>
  </div>
</div>

@if(showToast){
  <spk-toast
  [show]="showToast"
  [title]="toastObject.title"
  [content]="toastObject.content"
  header="Notification"
  [autohide]="true"
  (hide)="onToastHide()"
  (closeToast)="onToastClose()"
>
</spk-toast>
}
