<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="d-flex flex-column gap-4 p-3"
>
  <div class="row flex-wrap gy-2">
    <div class="col-lg-3">
      <spk-ng-select
        formControlName="userId"
        label="User Id"
        [options]="$any(users())"
        bindLabel="firstName"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose user"
        selectClass="form-control"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="licenseNumber"
        label="Lcense Number"
        type="text"
        placeholder="29303-4-4---4"
        icon="bi bi-card-text"
        [errorMessages]="{
          required: 'licenseNumber is required',
          backendError: apiFieldErrors['licenseNumber'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <spk-ng-select
        formControlName="specialtyId"
        label="Speciality Id"
        [options]="$any((specialities$ | async) ?? [])"
        bindLabel="firstName"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose speciality"
        selectClass="form-control"
      />
    </div>
    <div class="col-lg-3">
      <spk-ng-select
        formControlName="departmentLookupId"
        label="Department Id"
        [options]="$any((departments$ | async)?.lookupDetails ?? [])"
        bindLabel="valueNameEn"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose department"
        selectClass="form-control"
      />
    </div>
    <div class="col-lg-3">
      <spk-ng-select
        formControlName="branchId"
        label="Branch Id"
        [options]="$any((branches$ | async) ?? [])"
        bindLabel="name"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose branch"
        selectClass="form-control"
      />
    </div>
    <div class="col-lg-3">
      <spk-ng-select
        formControlName="nphiesProviderId"
        label="nphies Provider Id"
        [options]="$any(users())"
        bindLabel="firstName"
        bindValue="oid"
        [multiple]="false"
        placeholder="Choose provider"
        selectClass="form-control"
      />
    </div>
  </div>
  <div class="d-flex flex-column gap-2">
    <app-toggle-btn
      formControlName="isActive"
      label="Set doctor as active doctor"
    />
    <app-toggle-btn
      formControlName="isNphiesEnabled"
      label="Is Nphies enabled"
    />
  </div>

  <div class="d-flex justify-content-end gap-2">
    <app-button btnLabel="Cancel" [mainBtn]="false" (click)="cancel()" />
    <app-button btnLabel="Save Doctor" buttonType="submit" />
  </div>
</form>
