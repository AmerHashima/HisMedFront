<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="d-flex flex-column gap-4 p-3"
>
  <div class="row flex-wrap gy-2">
    <div class="col-lg-3">
      <app-input
        formControlName="lookupCode"
        label="Code"
        type="text"
        placeholder=""
        icon="bi bi-file-earmark-text-fill"
        [errorMessages]="{
          required: 'Code is required',
          backendError: apiFieldErrors['code'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="lookupNameAr"
        label="Arabic Name"
        type="text"
        placeholder=""
        icon="bi bi-file-earmark-text-fill"
        [errorMessages]="{
          required: 'Arabic Name is required',
          backendError: apiFieldErrors['lookupNameAr'],
        }"
      />
    </div>
<div class="col-lg-3">
      <app-input
        formControlName="lookupNameEn"
        label="Look UP Name"
        type="text"
        placeholder=""
        icon="bi bi-file-earmark-text-fill"
        [errorMessages]="{
          required: 'Name is required',
          backendError: apiFieldErrors['lookupNameEn'],
        }"
      />
    </div>
    <div class="col-lg-3">
      <app-input
        formControlName="description"
        label="Description"
        type="text"
        placeholder=""
        icon="bi bi-file-earmark-text-fill"
        [errorMessages]="{
          required: 'Description is required',
          backendError: apiFieldErrors['description'],
        }"
      />
    </div>
  </div>
  <div class="d-flex flex-column gap-2">
    <app-toggle-btn
      formControlName="isSystem"
      label="Set as system lookup"
    />
  </div>
  <div class="d-flex justify-content-end gap-2">
    <app-button btnLabel="Cancel" [mainBtn]="false" (click)="cancel()" />
    <app-button btnLabel="Save LookUP" buttonType="submit" />
  </div>
</form>
